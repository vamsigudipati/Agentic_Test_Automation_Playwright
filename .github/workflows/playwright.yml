name: Playwright E2E Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      reliability_runs:
        description: 'Number of repeated suite runs for the reliability job'
        required: false
        default: '5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  BACKEND_DIR: EAEmployeeWithTestSprite/backend
  FRONTEND_DIR: EAEmployeeWithTestSprite/frontend
  TESTS_DIR: EAEmployeeWithTestSprite/tests

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Full cross-browser suite (chromium, firefox, webkit, mobile projects)
  # ──────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E suite (all browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            EAEmployeeWithTestSprite/backend/package-lock.json
            EAEmployeeWithTestSprite/frontend/package-lock.json
            EAEmployeeWithTestSprite/tests/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: ${{ env.BACKEND_DIR }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}

      - name: Install test dependencies
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: ${{ env.TESTS_DIR }}

      - name: Start backend (port 4000)
        run: nohup node server.js > "$RUNNER_TEMP/backend.log" 2>&1 &
        working-directory: ${{ env.BACKEND_DIR }}

      - name: Start frontend (port 5173)
        run: nohup npx vite --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/frontend.log" 2>&1 &
        working-directory: ${{ env.FRONTEND_DIR }}

      - name: Wait for backend and frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/employees > /dev/null \
               && curl -sf http://localhost:5173/ > /dev/null; then
              echo "App is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::App did not become healthy in 60s"
          cat "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/frontend.log" || true
          exit 1

      - name: Run Playwright tests (headless)
        run: npx playwright test
        working-directory: ${{ env.TESTS_DIR }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: EAEmployeeWithTestSprite/tests/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload traces, screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: EAEmployeeWithTestSprite/tests/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: ${{ runner.temp }}/*.log
          retention-days: 7
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # Reliability: repeat the Chromium suite N times with retries disabled
  # and publish pass rate, flaky tests and p50/p95 durations per test.
  # ──────────────────────────────────────────────────────────────────────
  reliability:
    name: Reliability (chromium x N)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            EAEmployeeWithTestSprite/backend/package-lock.json
            EAEmployeeWithTestSprite/frontend/package-lock.json
            EAEmployeeWithTestSprite/tests/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix "$BACKEND_DIR"
          npm ci --prefix "$FRONTEND_DIR"
          npm ci --prefix "$TESTS_DIR"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.TESTS_DIR }}

      - name: Run reliability suite
        run: >
          node scripts/reliability.js
          --runs ${{ github.event.inputs.reliability_runs || 5 }}
          --project chromium
          --start-app
          --out ../../reports
        working-directory: ${{ env.TESTS_DIR }}

      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/reliability.md ]; then
            cat reports/reliability.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reliability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
